
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exception Details | Exception Copilot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            Exception Copilot
        </a>
    </nav>

    <main class="container py-4">

        <a href="dashboard.html" class="btn btn-outline-secondary mb-4">
            Back to Dashboard
        </a>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <h3 class="fw-bold">Exception Details</h3>
                <p class="text-muted">
                    Review the affected pharmaceutical record.
                </p>

                <hr>

                <div class="row g-3">
                    <div class="col-md-6">
                        <strong>Exception ID</strong>
                        <p id="exceptionId">Loading...</p>
                    </div>

                    <div class="col-md-6">
                        <strong>Product</strong>
                        <p>Paracetamol 500mg</p>
                    </div>

                    <div class="col-md-6">
                        <strong>Lot Number</strong>
                        <p>LOT-2026-A12</p>
                    </div>

                    <div class="col-md-6">
                        <strong>Error Type</strong>
                        <p>Duplicate Serial</p>
                    </div>
                </div>

                <hr>

                <h5>AI Diagnosis</h5>
                <p class="text-muted">
                    AI analysis will appear here after Gemini integration.
                </p>

                <button class="btn btn-primary" disabled>
                    Analyze with AI — Coming Soon
                </button>

            </div>
        </div>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        document.getElementById("exceptionId").textContent =
            id || "No exception ID provided";
    </script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exception Copilot | Login</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="./index.html">
            Exception Copilot
        </a>

        <span class="text-white">
            Pharmaceutical Operations
        </span>
    </nav>

    <!-- Main Login Section -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <!-- Page Heading -->
                <div class="text-center mb-4">
                    <h1 class="fw-bold">Welcome Back</h1>

                    <p class="text-secondary">
                        Sign in to access the Exception Copilot dashboard.
                    </p>
                </div>

                <!-- Login Card -->
                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <h4 class="fw-bold mb-4">
                            Sign In
                        </h4>

                        <!-- Login Feedback -->
                        <div
                            id="loginMessage"
                            class="alert d-none"
                            role="alert"
                        ></div>

                        <!-- Login Form -->
                        <form id="loginForm">

                            <!-- Email -->
                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold"
                                >
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Enter your email"
                                    autocomplete="username"
                                    required
                                >

                            </div>

                            <!-- Password -->
                            <div class="mb-4">

                                <label
                                    for="password"
                                    class="form-label fw-semibold"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >

                            </div>

                            <!-- Submit Button -->
                            <button
                                type="submit"
                                id="loginButton"
                                class="btn btn-primary w-100"
                            >
                                Sign In
                            </button>

                            <div class="text-end mt-3">
                                <a href="#" id="forgotPasswordLink" class="text-primary small">
                                    Forgot Password?
                                </a>
                            </div>

                        </form>

                    </div>

                </div>

                <!-- Footer -->
                <p class="text-center text-secondary small mt-4">
                    Authorized pharmaceutical operations personnel only.
                </p>

            </div>

        </div>

    </main>

    <!-- JavaScript Dependencies -->
    <!-- Supabase must load before application scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script>

</body>
</html>
